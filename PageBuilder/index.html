                />

                data-vvveb-shortcut="ctrl+z"

                <i class="la la-undo"></i>
            </button>

            <button
                class="btn btn-light"
                title="Redo (Ctrl/Cmd + Shift + Z)"
                id="redo-btn"
                data-vvveb-action="redo"
                data-vvveb-shortcut="ctrl+shift+z"

                <i class="la la-undo la-flip-horizontal"></i>
            </button>

            <div class="btn-group me-3" role="group">

                <i class="la la-hand-rock"></i>
            </button>

            <button
                class="btn btn-light"
                title="Preview"

                aria-pressed="false"
                data-vvveb-action="preview"

                <i class="icon-eye-outline"></i>
            </button>

            <button

                <i class="icon-layers-outline"></i>
            </button>

            <button

            </button>
            </div>

            <div class="btn-group me-2 float-end" role="group">
            <button

                data-v-vvveb-shortcut="ctrl+e"
            >

                <i class="icon-save-outline"></i>
                <span

                    role="status"

                </span>

                <i class="icon-save-outline"></i> <span>Save page</span>
